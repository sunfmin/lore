[[prohibition]]
rule = "Never remove, erase or change anything on a physical device but the app you installed (no other app, no setting, no `xcrun devicectl device erase`)"
why = "The device is a person's own phone, holding their data."

[[prohibition]]
rule = "Never build an app for a phone on another host than the one the phone is paired to, and never send model weights there from your host: download them on the phone's host from Hugging Face"
why = "Felix: compiling and building happen on the machine the iPhone is plugged into, and the big models are downloaded there from Hugging Face, not copied across."
