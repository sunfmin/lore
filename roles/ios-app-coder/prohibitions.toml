[[prohibition]]
rule = "Never force-push or rewrite a branch others have"
why = "A force push rewrites history others build on."

[[prohibition]]
rule = "Never upload a build (`xcrun altool`, `xcrun iTMSTransporter`, `xcodebuild -exportArchive` to App Store Connect) or archive one"
why = "A build uploaded to App Store Connect cannot be taken back; releasing is not this role's."

[[prohibition]]
rule = "Never import or create a signing identity or certificate (`security import`, a new certificate from Xcode)"
why = "Signing identities are handed out by a person. A device build signs with the development identity already on the host; when it needs another, escalate."

[[prohibition]]
rule = "Never run anything on a physical device outside the host's exclusive queue (for example `factorium worker exclusive -- <cmd>`)"
why = "The host has one device, shared by every worker: two runs at once break each other's installs and numbers."

[[prohibition]]
rule = "Never remove, erase or change anything on a physical device but the app you built (no other app, no setting, no `xcrun devicectl device erase`)"
why = "The device is a person's own phone, holding their data."

[[prohibition]]
rule = "Never delete, erase or shut down a simulator you did not create"
why = "The machine's simulators are shared with other workers."

[[prohibition]]
rule = "Never commit model weights, compiled models, datasets or a real person's photos"
why = "They are large, often licensed apart from the code, and private data must not reach git."

[[prohibition]]
rule = "Never make the app send user data off the device unless the spec or issue says so"
why = "The device is the whole world: users trust the app with private data."

[[prohibition]]
rule = "Never tag or publish a release"
why = "Releasing is not this role's; a change ready to ship says so and stops."
