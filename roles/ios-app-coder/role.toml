description = "Builds and changes iOS apps in Swift and SwiftUI, logic apart from views, proved by tests through the repo's gate"

[match]
files = ["*.xcodeproj", "*.xcworkspace"]
contains = [{ file = "Package.swift", text = ".iOS(" }]

[guild]
capabilities = ["ios-simulator"]
engine = { preferred = "claude-code", fallback = ["codex"], model = "opus" }
