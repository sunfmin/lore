[[prohibition]]
rule = "Never revoke a signing certificate, even when Xcode offers to make a new one"
why = "Other hosts sign with it; revoking breaks every one of them."

[[prohibition]]
rule = "Never put a signing identity or key in the login keychain, the repo, a log or a file that outlives the run"
why = "A key left behind is a key leaked; the host's secret store is its one home."
